    <circle cx="250" cy="249" r="3" fill="#a78bfa"/>
    <circle cx="101" cy="334" r="2.5" fill="#818cf8"/>
    <circle cx="274" cy="367" r="2.5" fill="#38bdf8"/>
  </g>

  <text x="180" y="492" text-anchor="middle" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">CAPTAINFLINT21</text>
